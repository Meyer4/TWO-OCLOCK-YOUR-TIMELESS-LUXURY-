# Single public entry point. Same-origin routing keeps auth cookies first-party:
#   /api/*  -> Express API (cookies, CSRF, webhooks: raw body untouched)
#   /*      -> Next.js storefront and admin
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  server_tokens off;
  keepalive_timeout 65;

  client_max_body_size 10m;

  gzip on;
  gzip_comp_level 5;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

  upstream api {
    server api:4000;
    keepalive 16;
  }

  upstream web {
    server web:3000;
    keepalive 16;
  }

  map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
  }

  server {
    listen 80;
    server_name _;

    # Behind a managed TLS terminator, uncomment HSTS here or in the platform.
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;

    location /api/ {
      proxy_pass http://api;
    }

    location /_next/static/ {
      proxy_pass http://web;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /placeholders/ {
      proxy_pass http://web;
      add_header Cache-Control "public, max-age=86400";
    }

    location / {
      proxy_pass http://web;
    }
  }
}
