# Full stack on one host: MongoDB, API, storefront (Next.js) and nginx on port 80.
#   cp server/.env.example server/.env   # then fill in secrets
#   docker compose up -d --build
#   docker compose run --rm api node dist/seed/seed.js   # optional, idempotent
name: two-oclock

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ./server
    restart: unless-stopped
    env_file: ./server/.env
    environment:
      NODE_ENV: production
      PORT: "4000"
      TRUST_PROXY: "1"
      MONGODB_URI: mongodb://mongo:27017/two_oclock
    depends_on:
      mongo:
        condition: service_healthy

  web:
    build:
      context: ./web
      args:
        API_INTERNAL_URL: http://api:4000
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost}
        NEXT_PUBLIC_STORE_NAME: ${NEXT_PUBLIC_STORE_NAME:-Timeless Luxury Two O'Clock}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_HERO_VIDEO_URL: ${NEXT_PUBLIC_HERO_VIDEO_URL:-}
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:4000
    depends_on:
      - api

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - web

volumes:
  mongo-data:
